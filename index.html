<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2330;--mute:#7a8494;--line:#e8eaee;--acc:#2f6fd0;--pos:#1a8f5c;--neg:#d9453b;--field:#f0f2f5;--warn:#c9831a;--grad:#2f6fd0}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#1a1f27;--ink:#eef1f5;--mute:#94a0b0;--line:#2a313c;--acc:#6ea3f5;--pos:#4cc79a;--neg:#f08a6c;--field:#242b35;--warn:#e8b04a;--grad:#2f5fb8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 0 calc(170px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:620px;margin:0 auto;padding:0 16px}
.title{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 8px}
.title h1{font-size:30px;margin:0;letter-spacing:-.5px}
.title small{color:var(--mute);font-size:12px}
.gear{border:0;background:var(--card);border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--mute);margin-left:10px}
.title .rt{display:flex;align-items:center}
.sec{font-size:13px;color:var(--mute);margin:20px 4px 6px;display:flex;justify-content:space-between;align-items:center}
.sec button{border:0;background:none;color:var(--acc);font-size:15px;padding:0}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
button.li:active{background:var(--field)}
.li .l{min-width:0;flex:1}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--mute)}
.li .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.hero{background:var(--card);border-radius:16px;padding:18px}
.hero .lab{font-size:13px;color:var(--mute)}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cols div{background:var(--field);border-radius:10px;padding:8px 10px}
.cols span{font-size:11px;color:var(--mute);display:block}
.cols b{font-size:15px;font-variant-numeric:tabular-nums}
.dh{font-size:12px;color:var(--mute);margin:14px 4px 4px}
.bar{height:7px;background:var(--field);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar i.over{background:var(--neg)}.bar i.near{background:var(--warn)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mnav b{font-size:17px}
.ib{border:0;background:var(--card);border-radius:10px;width:40px;height:36px;font-size:18px;color:var(--acc)}
.empty{background:var(--card);border-radius:16px;padding:26px 18px;text-align:center}
.empty p{color:var(--mute);margin:6px 0 14px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.sec2{background:var(--field);color:var(--acc)}
.btn.danger{background:var(--field);color:var(--neg)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.steps{text-align:left;margin:10px 0 16px;padding-left:20px;color:var(--mute);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0 9px;min-height:64px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button span{font-size:26px;line-height:1.1}
nav button.on{color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:6}
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:620px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.sh-h button{border:0;background:none;color:var(--acc);font-size:16px;padding:4px}
.sh-h button.pri{font-weight:700}
.sh-b{overflow:auto;padding:0 16px 24px}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f label{flex:none;color:var(--ink)}
.f input,.f select{flex:1;min-width:0;border:0;background:none;text-align:right;padding:2px 0;outline:none;color:var(--ink)}
.f input::placeholder{color:var(--mute)}
.f.amt input{font-size:28px;font-weight:700}
.seg{display:flex;background:var(--field);border-radius:9px;padding:2px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:7px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.info{padding:12px 14px;font-size:13px;color:var(--mute)}
.info b{color:var(--ink)}
.err{color:var(--neg);font-size:13px;margin:8px 4px;min-height:18px}
.delbtn{margin-top:14px;width:100%}
.catrow{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow input{flex:1;border:0;background:none;outline:none;min-width:0}
.catrow button{border:0;background:none;color:var(--neg);font-size:15px}
.note{font-size:12px;color:var(--mute);margin:8px 4px}

.list{border-radius:20px;box-shadow:none}
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:20px;box-shadow:none}
.hero .lab{color:rgba(255,255,255,.88);font-weight:600}
.hero .big{font-size:40px;font-weight:800}
.hero .cols div{background:rgba(255,255,255,.2)}
.hero .cols span{color:rgba(255,255,255,.88)}
.hero .pos,.hero .neg{color:#fff}
.title h1{font-weight:800}
.ic{width:38px;height:38px;border-radius:13px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.bar{height:9px;border-radius:5px}
.bar i{background:var(--grad)}
.bar i.near{background:var(--warn)}
.bar i.over{background:var(--neg)}
.btn{background:var(--grad);border-radius:14px;box-shadow:none}
.btn.sec2{background:var(--field);color:var(--acc);box-shadow:none}
.btn.danger{background:var(--field);color:var(--neg);box-shadow:none}
.fab{background:var(--grad);box-shadow:0 4px 12px rgba(20,30,60,.25);width:60px;height:60px;border-radius:30px}
nav button.on span{background:var(--field);border-radius:14px;padding:0 16px}
.seg button.on{color:var(--acc)}
.sec{font-weight:700}
.empty{border-radius:24px;box-shadow:none}
.sheet{border-radius:24px 24px 0 0}
.ib,.gear{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button,.chiprow button{border:0;background:var(--field);color:var(--mute);border-radius:999px;padding:6px 13px;font-size:13px;flex:none}
.chips button.on,.chiprow button.on{background:var(--acc);color:#fff}
.chiprow{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.catrow .emo{flex:none;width:44px;text-align:center;font-size:20px;background:var(--field);border-radius:10px;padding:4px 0}
.catrow .cnt{font-size:12px;color:var(--mute);flex:none}
.scan{display:block;text-align:center;background:var(--field);color:var(--acc);border-radius:14px;padding:12px;font-weight:600;margin:0 0 6px;cursor:pointer}
.scanmsg{font-size:13px;color:var(--mute);min-height:18px;margin:0 4px 10px}
.scanmsg.bad{color:var(--neg)}
.voice{display:flex;gap:6px;margin:0 0 6px}
.voice textarea{flex:1;min-width:0;background:var(--field);border:0;border-radius:12px;padding:11px 12px;outline:none;color:var(--ink);font:inherit;resize:none}
.voice .vb{border:0;background:var(--field);border-radius:12px;padding:0 14px;font-size:18px}
.voice .go{font-size:14px;color:var(--acc);font-weight:600}
.bigbtn{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px 16px;margin:0 0 10px;width:100%;border:0;text-align:left;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer}
.bigbtn .bi{font-size:30px;width:52px;height:52px;border-radius:15px;background:var(--field);display:flex;align-items:center;justify-content:center;flex:none}
.bigbtn small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
.area{display:block;width:100%;background:var(--card);border:0;border-radius:14px;padding:12px;font:inherit;color:var(--ink);resize:vertical;outline:none;min-height:130px;margin:0 0 10px}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" id="fab" data-a="choose" aria-label="取引を追加">＋</button>
<nav id="nav">
  <button data-a="tab:home" data-t="home"><span>⌂</span>ホーム</button>
  <button data-a="tab:txns" data-t="txns"><span>☰</span>取引</button>
  <button data-a="tab:pay" data-t="pay"><span>⇄</span>収支</button>
  <button data-a="tab:budget" data-t="budget"><span>◔</span>予算</button>
  <button data-a="tab:assets" data-t="assets"><span>¥</span>資産</button>
</nav>
<div class="sheet-wrap hidden" id="sheet"></div>

<script>
const LS='money-app-v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const num=v=>Number(v)||0;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ymOf=d=>d.slice(0,7);
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dim=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const dayStr=(m,day)=>m+'-'+pad(Math.max(1,Math.min(day,dim(m))));
const ymLabel=k=>k.slice(0,4)+'年'+Number(k.slice(5))+'月';
const mdLabel=d=>Number(d.slice(5,7))+'/'+Number(d.slice(8));
const WD=['日','月','火','水','木','金','土'];
const dLabel=d=>{const[y,m,dd]=d.split('-').map(Number);return m+'月'+dd+'日（'+WD[new Date(y,m-1,dd).getDay()]+'）'};

function empty(){return{v:2,accounts:[],cards:[],loans:[],recs:[],txns:[],budgets:{},
  cats:[{id:'e1',name:'住居'},{id:'e2',name:'食費'},{id:'e3',name:'光熱・通信'},{id:'e4',name:'交通'},{id:'e5',name:'日用品'},{id:'e6',name:'娯楽・交際'},{id:'e7',name:'その他'}]}}
let S=empty(),tab='home',mon=ymOf(today()),F=null,pf='all',tf='';

/* ===== 計算 ===== */
function stmtOf(c,d){
  const ym=ymOf(d),day=Number(d.slice(8)),close=num(c.closing);
  const cm=(close===0||day<=close)?ym:addM(ym,1);
  return{key:cm,pay:dayStr(addM(cm,c.offset==null?1:num(c.offset)),num(c.payDay)||27)};
}
function cardInfo(c){
  const m={},t=today();
  S.txns.forEach(x=>{if(x.type==='expense'&&x.card===c.id&&x.date<=t){const s=stmtOf(c,x.date);const e=m[s.key]||(m[s.key]={key:s.key,pay:s.pay,total:0,n:0});e.total+=x.amount;e.n++}});
  const st=Object.values(m).sort((a,b)=>a.pay<b.pay?-1:1),up=st.filter(s=>s.pay>t);
  return{st,unpaid:up.reduce((a,s)=>a+s.total,0),debited:st.filter(s=>s.pay<=t).reduce((a,s)=>a+s.total,0),next:up[0]||null};
}
function accBal(a,withoutOpening){
  const t=today();let b=withoutOpening?0:num(a.opening);
  S.txns.forEach(x=>{if(x.date>t||x.acc!==a.id)return;if(x.type==='income')b+=x.amount;else b-=x.amount});
  S.cards.forEach(c=>{if(c.acc===a.id)b-=cardInfo(c).debited});
  return b;
}
function loanState(l){
  let bal=num(l.bal0),pi=0,pp=0;const t=today();
  S.txns.filter(x=>x.type==='loanpay'&&x.loan===l.id&&x.date>l.asOf&&x.date<=t).sort((a,b)=>a.date<b.date?-1:1).forEach(x=>{
    const int=Math.round(bal*num(l.rate)/100/12),pr=Math.max(0,Math.min(bal,x.amount-int));bal-=pr;pp+=pr;pi+=x.amount-pr});
  return{bal,paidInt:pi,paidPrin:pp};
}
function loanProj(l,bal){
  if(bal<=0)return{done:true};
  const r=num(l.rate)/100/12,p=num(l.monthly);if(p<=0)return null;
  let n=0,ti=0,b=bal;
  while(b>0&&n<600){const i=Math.round(b*r);if(p<=i)return{never:true};ti+=i;b-=p-i;n++}
  return{n,ti,end:addM(ymOf(today()),n)};
}
function mSum(m){
  let inc=0,exp=0,rep=0;const byCat={};
  S.txns.forEach(t=>{if(ymOf(t.date)!==m)return;if(t.type==='income')inc+=t.amount;else if(t.type==='expense'){exp+=t.amount;byCat[t.cat]=(byCat[t.cat]||0)+t.amount}else rep+=t.amount});
  return{inc,exp,rep,byCat};
}
function totals(){
  const assets=S.accounts.reduce((a,x)=>a+accBal(x),0),cards=S.cards.reduce((a,c)=>a+cardInfo(c).unpaid,0),loans=S.loans.reduce((a,l)=>a+loanState(l).bal,0);
  return{assets,cards,loans,net:assets-cards-loans};
}
const CE={e1:'🏠',e2:'🍙',e3:'💡',e4:'🚃',e5:'🧴',e6:'🎉',e7:'✨'};
const catIcon=id=>{const c=S.cats.find(x=>x.id===id);return(c&&c.icon)||CE[id]||'🏷️'};
const parseTags=str=>{const o=[];String(str||'').split(/[\s,、#＃:：]+/).forEach(t=>{t=t.trim();if(t&&!o.includes(t))o.push(t)});return o};
const tagStr=a=>(a||[]).map(t=>'#'+t).join(' ');
function allTags(){const m={};S.txns.forEach(x=>(x.tags||[]).forEach(t=>m[t]=(m[t]||0)+1));S.recs.forEach(r=>(r.tags||[]).forEach(t=>{if(!m[t])m[t]=0}));return Object.keys(m).map(t=>({t,n:m[t]})).sort((a,b)=>b.n-a.n||(a.t<b.t?-1:1))}
const KICON={income:'💰',card:'💳',loan:'🏦',fixed:'📌',other:'👛'};
const TI={'ホーム':'🏡','取引':'🧾','収支':'💸','予算':'🎯','資産':'💎','設定':'⚙️','マネー管理':'👛'};
const cardRule=c=>(num(c.closing)?num(c.closing)+'日締め':'月末締め')+'・'+['当月','翌月','翌々月'][c.offset==null?1:num(c.offset)]+(num(c.payDay)||27)+'日払い';
const catName=id=>(S.cats.find(c=>c.id===id)||{name:'未分類'}).name;
const payName=t=>t.card?(S.cards.find(c=>c.id===t.card)||{name:'カード'}).name:(S.accounts.find(a=>a.id===t.acc)||{name:'口座'}).name;

/* ===== 固定の収入・支出 / ローン自動記録 ===== */
function gen(){
  const t=today(),cur=ymOf(t);let ch=false;
  const run=(src,kind)=>{
    let m=src.last?addM(src.last,1):(kind==='loan'?ymOf(src.asOf):(src.startYm||cur));
    if(m<addM(cur,-36))m=addM(cur,-36);
    while(m<=cur){
      const d=dayStr(m,num(src.day||src.payDay)||1);
      if(d>t)break;
      if(!(kind==='loan'&&d<=src.asOf)){
        if(kind==='loan')S.txns.push({id:uid('t'),date:d,type:'loanpay',amount:num(src.monthly),loan:src.id,acc:src.acc,memo:'',src:src.id});
        else S.txns.push({id:uid('t'),date:d,type:src.type,amount:num(src.amount),cat:src.cat,acc:src.card?null:src.acc,card:src.card||null,memo:src.name,tags:(src.tags||[]).slice(),src:src.id});
      }
      src.last=m;m=addM(m,1);ch=true;
    }
  };
  S.recs.forEach(r=>run(r,'rec'));
  S.loans.forEach(l=>{if(num(l.monthly)>0&&l.payDay)run(l,'loan')});
  return ch;
}

/* ===== 保存 ===== */
let doc=null,saveT=null;
function setStatus(t){const e=$('#status');if(e)e.textContent=({cloud:'☁︎ 保存済み（あなた専用の領域）',local:'この端末のブラウザにのみ保存',err:'⚠︎ クラウド保存に失敗（端末内には保存済み）',load:'読み込み中…'})[t]||'';window.__st=t}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
    if(doc){try{await doc.set(JSON.parse(JSON.stringify(S)));setStatus('cloud')}catch(e){setStatus('err')}}
  },400);
}
function readSnap(s){if(!s)return null;try{const ex=typeof s.exists==='function'?s.exists():s.exists;if(ex===false)return null;return typeof s.data==='function'?s.data():s}catch(e){return null}}
async function initStore(){
  try{if(window.claude&&claude.use)claude.use('sample').then(x=>{AI.sample=x}).catch(()=>{})}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{const t=localStorage.getItem(LS);if(t){const d=JSON.parse(t);if(d&&d.v===2)S=d}}catch(e){}
  if(gen())save();
  render();
  try{
    if(!window.claude||!claude.use){setStatus('local');return}
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){setStatus('local');return}
    const id=await user.id();
    doc=db.collection('data/users/'+id).doc('app2');
    const snap=await Promise.race([doc.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
    const d=readSnap(snap);
    if(d&&d.v===2){S=d;if(!S.accounts)S.accounts=[];['cards','loans','recs','txns'].forEach(k=>{if(!S[k])S[k]=[]});if(!S.budgets)S.budgets={};gen();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
    else if(S.txns.length||S.accounts.length){await doc.set(JSON.parse(JSON.stringify(S)))}
    setStatus('cloud');render();
  }catch(e){doc=null;setStatus('local')}
}

/* ===== 画面 ===== */
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#fab').style.display='';
  $('#view').innerHTML=({home:homeV,txns:txnsV,pay:payV,budget:budgetV,assets:assetsV,settings:settingsV})[tab]();
}
const head=(t,sub)=>`<div class="title"><h1>${t} ${TI[t]||''}</h1><div class="rt"><small>${sub||''}</small>${tab==='settings'?'':'<button class="gear" data-a="tab:settings" aria-label="設定">⚙︎</button>'}</div></div>`;

function onboarding(){

function txnRow(x){

  const sub=x.type==='loanpay'?payName(x):(x.type==='income'?'収入':catName(x.cat))+' ・ '+payName(x);
  const ico=x.type==='income'?'💰':x.type==='loanpay'?'🏦':catIcon(x.cat);
  return`<button class="li" data-a="txn:${x.id}"><span class="ic">${ico}</span><div class="l"><div class="t">${esc(title)}</div><div class="s">${mdLabel(x.date)} ・ ${esc(sub)}${x.tags&&x.tags.length?' ・ '+x.tags.map(t=>'#'+esc(t)).join(' '):''}</div></div><div class="r ${cls}">${sign}${yen(x.amount).replace('-','')}</div></button>`;
}

const KINDS={income:'給与・収入',card:'カード引き落とし',loan:'ローン返済',fixed:'固定費',other:'現金・口座'};
function paymentsOf(m){
  const t=today(),cur=ymOf(t),out=[];
  S.cards.forEach(c=>cardInfo(c).st.forEach(s=>{if(ymOf(s.pay)===m)out.push({date:s.pay,name:c.name,sub:Number(s.key.slice(5))+'月締め・'+s.n+'件',kind:'card',amount:s.total,done:s.pay<=t,act:'card:'+c.id})}));
  S.txns.forEach(x=>{
    if(ymOf(x.date)!==m)return;
    if(x.type==='income')out.push({date:x.date,name:x.memo||'収入',sub:payName(x)+' に入金',kind:'income',amount:x.amount,done:x.date<=t,act:'txn:'+x.id});
    else if(x.type==='loanpay')out.push({date:x.date,name:(S.loans.find(l=>l.id===x.loan)||{name:'ローン'}).name,sub:'',kind:'loan',amount:x.amount,done:x.date<=t,act:'txn:'+x.id});
    else if(x.type==='expense'&&!x.card)out.push({date:x.date,name:x.memo||catName(x.cat),sub:catName(x.cat)+' ・ '+payName(x),kind:x.src?'fixed':'other',amount:x.amount,done:x.date<=t,act:'txn:'+x.id});
  });
  if(m>=cur){
    S.loans.forEach(l=>{
      if(!(num(l.monthly)>0&&l.payDay)||loanState(l).bal<=0)return;
      if(S.txns.some(x=>x.type==='loanpay'&&x.loan===l.id&&ymOf(x.date)===m))return;
      const d=dayStr(m,num(l.payDay));if(d>t)out.push({date:d,name:l.name,sub:'予定（毎月自動）',kind:'loan',amount:num(l.monthly),done:false,act:'loan:'+l.id});
    });
    S.recs.forEach(r=>{
      if(r.card)return;
      if(S.txns.some(x=>x.src===r.id&&ymOf(x.date)===m))return;
      const d=dayStr(m,num(r.day)||1);if(d>t)out.push({date:d,name:r.name,sub:(r.type==='income'?'入金予定':catName(r.cat))+' ・ 予定（毎月自動）',kind:r.type==='income'?'income':'fixed',amount:num(r.amount),done:false,act:'rec:'+r.id});
    });
  }
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function payV(){
  if(!S.accounts.length)return onboarding();
  const all=paymentsOf(mon),sum=a=>a.reduce((x,p)=>x+p.amount,0);
  const inc=all.filter(p=>p.kind==='income'),pays=all.filter(p=>p.kind!=='income');
  const income=sum(inc),payTotal=sum(pays),payPlan=sum(pays.filter(p=>!p.done)),diff=income-payTotal;
  let h=head('収支')+`<div class="mnav"><button class="ib" data-a="mon:-1" aria-label="前の月">‹</button><b>${ymLabel(mon)}</b><button class="ib" data-a="mon:1" aria-label="次の月">›</button></div>

  <div class="cols"><div><span>収入</span><b class="pos">${yen(income)}</b></div><div><span>支払い合計</span><b>${yen(payTotal)}</b></div><div><span>うち予定</span><b>${yen(payPlan)}</b></div></div></div>
  <div class="sec">種類別</div><div class="list"><div class="li"><span>${KICON.income} ${KINDS.income}</span><b class="pos">+${yen(income).replace('-','')}</b></div>${['card','loan','fixed','other'].map(k=>{const a=sum(pays.filter(p=>p.kind===k));return`<div class="li"><span>${KICON[k]} ${KINDS[k]}</span><span><b>${yen(a)}</b> <span class="s">${payTotal?Math.round(a/payTotal*100):0}%</span></span></div>`}).join('')}</div>
  <div class="sec">一覧</div>
  <div class="seg">${[['all','すべて'],['income','収入'],['card','カード'],['loan','ローン'],['fixed','固定費'],['other','現金']].map(o=>`<button data-a="pf:${o[0]}" class="${pf===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;
  const list=pf==='all'?all:all.filter(p=>p.kind===pf);
  if(!list.length)return h+`<div class="empty"><p>この月の該当はありません</p></div>`;
  return h+`<div class="list">${list.map(p=>`<button class="li" data-a="${p.act}"><span class="ic">${KICON[p.kind]}</span><div class="l"><div class="t">${esc(p.name)}</div><div class="s">${mdLabel(p.date)} ・ ${KINDS[p.kind]}${p.sub?' ・ '+esc(p.sub):''}</div></div><div class="r ${p.kind==='income'?'pos':''}">${p.kind==='income'?'+':''}${yen(p.amount)}<div class="s" style="${p.done?'':'color:var(--warn)'}">${p.done?(p.kind==='income'?'入金済':'済'):'予定'}</div></div></button>`).join('')}</div>
  <div class="note">カード払いの買い物は、引き落とし日にまとめて「カード引き落とし」として表示されます。</div>`;
}

  <div class="note" id="msg"></div><div class="note" id="status"></div>`;

/* ===== 入力シート ===== */
function openForm(f){F=f;renderSheet();$('#sheet').classList.remove('hidden')}
function closeForm(){F=null;$('#sheet').classList.add('hidden');$('#sheet').innerHTML=''}
function fieldHtml(f,v){
  if(f.type==='seg')return`<div class="seg">${f.options.map(o=>`<button data-seg="${f.k}" data-v="${o[0]}" class="${v[f.k]===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;
  if(f.type==='info')return`<div class="info">${f.html}</div>`;
  if(f.type==='voice')return`<div class="voice"><textarea rows="3" data-voice="1" placeholder="話す・打つ・貼り付け　例：昨日 スーパーで3800円" aria-label="声・文章で入力">${esc((F&&F.voiceText)||'')}</textarea><button class="vb" data-vb="mic" aria-label="音声入力">🎤</button><button class="vb go" data-vb="go">反映</button></div><div class="scanmsg" id="voicemsg"></div>`;
  if(f.type==='paychips')return`<div class="dh" style="margin:0 4px 6px">${esc(f.label)}</div><div class="chips">${f.options.map(o=>`<button data-payk="${f.k}" data-v="${esc(o[0])}" class="${v[f.k]===o[0]?'on':''}">${o[0][0]==='c'?'💳':'🏧'} ${esc(o[1].replace('（カード）',''))}</button>`).join('')}</div>`;
  if(f.type==='area')return`<textarea class="area" data-k="${f.k}" rows="7" placeholder="${esc(f.ph||'')}">${esc(v[f.k]||'')}</textarea>`;
  if(f.type==='scan')return`<label class="scan">📷 写真・PDFから自動入力<input type="file" accept="image/*,application/pdf" multiple data-scan="1" style="display:none"></label><div class="scanmsg" id="scanmsg"></div>`;
  if(f.type==='check')return`<div class="f"><label for="ck-${f.k}" style="flex:1;font-size:14px">${esc(f.label)}</label><input id="ck-${f.k}" type="checkbox" data-k="${f.k}" style="flex:none;width:22px;height:22px" ${v[f.k]?'checked':''}></div>`;
  if(f.type==='chips')return`<div class="chips">${f.tags.map(t=>`<button data-tag="${esc(t)}" class="${f.sel.includes(t)?'on':''}">#${esc(t)}</button>`).join('')}</div>`;
  const val=v[f.k]==null?'':v[f.k];let c;
  if(f.type==='select')c=`<select data-k="${f.k}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(val)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else c=`<input data-k="${f.k}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}">`;
  return`<div class="f ${f.amt?'amt':''}"><label>${esc(f.label)}</label>${c}</div>`;
}
function renderSheet(){
  const fs=F.fields(F.vals);let body='',grp='';
  const flush=()=>{if(grp)body+=`<div class="list">${grp}</div>`;grp=''};

function parseCardLine(line){
  let t=normSpeech(line).replace(/[　]/g,' ').trim();if(!t)return null;
  let m,offset=null,closing=null,payDay=null;
  if((m=t.match(/翌々月/))){offset=2;t=t.replace(m[0],' ')}
  else if((m=t.match(/翌月|来月/))){offset=1;t=t.replace(m[0],' ')}
  else if((m=t.match(/当月|今月|同月/))){offset=0;t=t.replace(m[0],' ')}
  if((m=t.match(/(\d{1,2})\s*日?\s*締め?/))){closing=num(m[1]);t=t.replace(m[0],' ')}
  else if((m=t.match(/(?:月末|末)\s*日?\s*締め?/))){closing=0;t=t.replace(m[0],' ')}
  if((m=t.match(/(\d{1,2})\s*日?\s*(?:支払い?|払い?|引き?落とし?|引落)/))){payDay=num(m[1]);t=t.replace(m[0],' ')}
  if(closing===null||payDay===null||payDay<1||payDay>31||closing>31)return null;
  if(offset===null)offset=(closing>0&&payDay>closing)?0:1;
  const name=t.replace(/[、,:：]/g,' ').replace(/\s+/g,' ').trim().replace(/(の)?(支払い?|払い)$/,'').trim();
  if(!name)return null;
  return{name,closing,payDay,offset};
}

function kanji2num(str){
  const d={'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  let total=0,sec=0,cur=0;
  for(const ch of str){
    if(ch in d)cur=d[ch];
    else if(ch==='十'){sec+=(cur||1)*10;cur=0}
    else if(ch==='百'){sec+=(cur||1)*100;cur=0}
    else if(ch==='千'){sec+=(cur||1)*1000;cur=0}
    else if(ch==='万'){total+=((sec+cur)||1)*10000;sec=0;cur=0}
  }
  return total+sec+cur;
}
function normSpeech(t){
  return String(t||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',')
    .replace(/(\d),(?=\d{3}(?!\d))/g,'$1')
    .replace(/([一二三四五六七八九十百千万〇]+)(?=円|日|月)/g,(m,g,off,str)=>(/^万+$/.test(m)||/\d/.test(str[off-1]||''))?m:String(kanji2num(m)));
}
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function extractDate(t){
  const T=today(),now=new Date();let m,date=null;
  const rel=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
  if((m=t.match(/一昨日|おととい/))){date=rel(-2)}
  else if((m=t.match(/昨日|きのう/))){date=rel(-1)}
  else if((m=t.match(/今日|きょう|本日/))){date=T}
  else if((m=t.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))){
    const y=num(m[1]),mo=num(m[2]),dd=num(m[3]);
    date=y+'-'+pad(mo)+'-'+pad(Math.min(dd,dim(y+'-'+pad(mo))));
  }
  else if((m=t.match(/(^|[^\d\/])(\d{1,2})\/(\d{1,2})(?![\d\/])/))&&num(m[2])>=1&&num(m[2])<=12&&num(m[3])>=1&&num(m[3])<=31){
    const y=now.getFullYear(),mo=num(m[2]),dd=num(m[3]);
    let ds=y+'-'+pad(mo)+'-'+pad(Math.min(dd,dim(y+'-'+pad(mo))));
    if(ds>rel(31))ds=(y-1)+ds.slice(4);
    date=ds;
  }
  else if((m=t.match(/(?:(\d{4})年)?\s*(\d{1,2})月\s*(\d{1,2})日/))){
    let y=m[1]?num(m[1]):now.getFullYear();const mo=num(m[2]),dd=num(m[3]);
    let ds=y+'-'+pad(mo)+'-'+pad(Math.min(dd,dim(y+'-'+pad(mo))));
    if(!m[1]&&ds>rel(31))ds=(y-1)+ds.slice(4);
    date=ds;
  }else if((m=t.match(/(\d{1,2})日(?!間|前)/))){
    const dd=num(m[1]);let ym=ymOf(T);let ds=dayStr(ym,dd);
    if(ds>T){ym=addM(ym,-1);ds=dayStr(ym,dd)}
    date=ds;
  }
  return{date,t:m?t.replace(m[0],' '):t};
}

  else if((m=t.match(/(\d+)\s*千\s*円?/)))amount=num(m[1])*1000;

  if(m)t=t.replace(m[0],' ');
  if(!(amount>0))return{date:ed.date,item:null};
  const type=/給料|給与|ボーナス|賞与|もらった|もらい|入金|収入|振り込まれ|お小遣い|バイト代|返金/.test(seg)?'income':'expense';
  let name=t.replace(/使った|つかった|払った|はらった|支払った|買った|かった|かかった|もらった|入った|入金|でした|です|だった|決済|円/g,' ').replace(/\s+/g,' ').trim();
  name=name.replace(/^[でにをはがとの、。\s]+|[でにをはがと、。\s]+$/g,'').slice(0,20);
  return{date:ed.date,item:{date:ed.date||dflt||today(),amount,type,name,cat:type==='income'?null:voiceCat(seg),tags}};
}
function parseVoice(text){
  const segs=normSpeech(text).split(/[、。\n]|それから|そして|あとは|あと/).map(x=>x.trim()).filter(Boolean);
  const out=[];let d=null;
  segs.forEach(sg=>{const r=parseVoiceSeg(sg,d);if(r.item){out.push(r.item);d=r.item.date}else if(r.date)d=r.date});
  return out;
}
function voicePay(text){
  const t=String(text||''),opts=payOpts().slice().sort((a,b)=>b[1].length-a[1].length);
  for(const o of opts){const nm=o[1].replace('（カード）','');if(nm&&t.includes(nm))return o[0]}
  if(/カード|クレジット/.test(t)&&S.cards.length===1)return 'c:'+S.cards[0].id;
  return null;
}
function voiceMsg(t,bad){const e=$('#voicemsg');if(e){e.textContent=t;e.className='scanmsg'+(bad?' bad':'')}}
function applyVoice(text){
  text=String(text||'').trim();
  if(!text){voiceMsg('話すか文章を入れてください。キーボードのマイク🎤でも話せます。',1);return}
  const items=parseVoice(text);
  if(!items.length){voiceMsg('金額が聞き取れませんでした。「昨日 スーパーで3800円」のように話してみてください。',1);return}
  const vp=voicePay(text);
  if(items.length>1||!(F&&F.vals&&'memo' in F.vals)){closeForm();openScanReview(items,vp);return}
  const it=items[0];
  Object.assign(F.vals,{type:it.type,amount:it.amount,date:it.date,memo:it.name,tags:tagStr(it.tags)});
  if(it.type==='expense'&&it.cat)F.vals.cat=it.cat;
  if(vp&&(it.type==='expense'||vp[0]==='a'))F.vals.pay=vp;
  if(it.type==='income'&&String(F.vals.pay||'')[0]!=='a'&&S.accounts[0])F.vals.pay='a:'+S.accounts[0].id;
  F.voiceText=text;renderSheet();voiceMsg('反映しました。内容を確認して保存してください。');
}
let micOn=false;
function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const focus=()=>{const i=document.querySelector('[data-voice]');if(i&&i.focus)i.focus()};
  if(!SR){voiceMsg('この環境では音声ボタンが使えません。入力欄をタップして、キーボードのマイク🎤で話してください。',1);focus();return}
  if(micOn)return;
  let r;try{r=new SR();r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=1}catch(e){voiceMsg('音声認識を開始できませんでした。キーボードのマイク🎤で話してください。',1);focus();return}
  r.onresult=e=>{const t=(e.results&&e.results[0]&&e.results[0][0]&&e.results[0][0].transcript)||'';if(F)F.voiceText=t;applyVoice(t)};
  r.onerror=e=>{micOn=false;voiceMsg((e&&(e.error==='not-allowed'||e.error==='service-not-allowed'))?'マイクが使えません（許可されていない可能性があります）。キーボードのマイク🎤で話してください。':'うまく聞き取れませんでした。もう一度どうぞ。',1);focus()};
  r.onend=()=>{micOn=false};
  try{micOn=true;r.start();voiceMsg('聞いています… 話してください')}catch(e){micOn=false;voiceMsg('音声認識を開始できませんでした。キーボードのマイク🎤で話してください。',1);focus()}
}
/* ===== 写真・PDFの自動読み取り ===== */
const AI={sample:null},KEYLS='money-apikey';
const getKey=()=>{try{return localStorage.getItem(KEYLS)||''}catch(e){return''}};
let scanning=false;
function scanMsg(t,bad){const e=$('#scanmsg');if(e){e.textContent=t;e.className='scanmsg'+(bad?' bad':'')}}
function loadScript(src){return new Promise((ok,ng)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>ng(new Error('load'));document.head.appendChild(e)})}
function canvasBlob(c){return new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}
function drawScaled(src,w,h){const sc=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);return c}
async function fileToBlobs(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
    if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
    for(let i=1;i<=Math.min(pdf.numPages,4);i++){
      const pg=await pdf.getPage(i),vp0=pg.getViewport({scale:1}),sc=Math.min(2,1600/Math.max(vp0.width,vp0.height)),vp=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(await canvasBlob(c));
    }
    return out;
  }
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ng(new Error('img'));i.src=url});return[await canvasBlob(drawScaled(img,img.naturalWidth,img.naturalHeight))]}
  finally{URL.revokeObjectURL(url)}
}
const blobB64=b=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>ng(new Error('read'));r.readAsDataURL(b)});
function aiPrompt(){
  return`あなたは家計簿の入力補助です。添付の画像（レシート・領収書・請求書・利用明細・通帳やカード明細のスクリーンショットなど）から、お金の出入りを読み取り、JSONだけを返してください。説明文やコードブロックは不要です。
今日の日付は${today()}です。年が書かれていない日付はこの年として扱います。通貨は日本円です。
形式: {"items":[{"date":"YYYY-MM-DD","amount":整数,"type":"expense または income","name":"店名や内容","category":"候補から最も近いもの","tags":[]}]}
ルール:
- レシート・領収書は、支払合計の1件にまとめる（小計・税・おつりは別にしない）。
- 明細書や一覧は、1行を1件にする。
- amount は正の整数。読み取れない項目は含めない。
- 給与や振込入金などは type を income、category を空文字にする。
- category の候補: ${S.cats.map(c=>c.name).join('、')}
- tags は基本的に空の配列にする。`;
}
function normItems(raw){
  let d;try{const m=String(raw||'').match(/\{[\s\S]*\}/);d=JSON.parse(m?m[0]:raw)}catch(e){return[]}
  const arr=Array.isArray(d)?d:(d&&d.items)||[];
  const fallback=(S.cats.find(c=>c.name==='その他')||S.cats[S.cats.length-1]||{}).id||null;
  return arr.map(x=>{
    const amount=Math.round(Math.abs(num(String(x.amount).replace(/[,，¥￥円]/g,''))));
    if(!(amount>0))return null;
    const type=x.type==='income'?'income':'expense';
    const nm=String(x.category||'').trim();
    const cat=type==='income'?null:((S.cats.find(c=>c.name===nm)||S.cats.find(c=>nm&&(c.name.includes(nm)||nm.includes(c.name)))||{}).id||fallback);
    return{date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:today(),amount,type,name:String(x.name||'').slice(0,40),cat,tags:Array.isArray(x.tags)?x.tags.map(t=>String(t)).filter(Boolean).slice(0,5):[]};
  }).filter(Boolean).slice(0,40);
}
async function aiExtract(blobs){
  const prompt=aiPrompt();
  if(AI.sample){
    try{const lim=AI.sample.limits?await AI.sample.limits():{images:true};if(lim&&lim.images===false)throw{code:'noimg'}}catch(e){if(e&&e.code==='noimg')throw e}
    const r=await AI.sample(prompt,{images:blobs,modelTier:'default',cache:false});return normItems(r.text);
  }
  const key=getKey();if(!key)throw{code:'nokey'};
  const content=[];for(const b of blobs)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobB64(b)}});
  content.push({type:'text',text:prompt});
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:2000,messages:[{role:'user',content}]})});
  if(!res.ok)throw{code:'http',status:res.status};
  const j=await res.json();return normItems((j.content||[]).map(c=>c.text||'').join(''));
}
async function handleScan(files){
  if(scanning||!files||!files.length)return;
  scanning=true;scanMsg('読み取り中…（数十秒かかることがあります）');
  try{
    let blobs=[];for(const f of Array.from(files).slice(0,6))blobs=blobs.concat(await fileToBlobs(f));
    blobs=blobs.slice(0,6);if(!blobs.length)throw{code:'empty'};
    const items=await aiExtract(blobs);
    if(!items.length){scanMsg('金額を読み取れませんでした。もう少し明るく、全体が写るように撮り直してみてください。',1);return}
    if(items.length===1&&F&&F.vals&&'memo' in F.vals){
      const it=items[0];Object.assign(F.vals,{type:it.type,amount:it.amount,date:it.date,memo:it.name,tags:tagStr(it.tags)});
      if(it.type==='expense'&&it.cat)F.vals.cat=it.cat;
      renderSheet();scanMsg('読み取りました。内容を確認して保存してください。');
    }else{closeForm();openScanReview(items)}
  }catch(e){
    const c=e&&e.code;
    scanMsg(c==='nokey'?'この単体アプリでは、設定にAPIキーを入れると使えます（Claude内のアプリではそのまま使えます）。':c==='noimg'?'この環境では画像の読み取りができません。':c==='rate_limited'?'混み合っています。少し待ってからもう一度お試しください。':c==='not_granted'?'読み取りの許可がありません。':c==='http'?'読み取りに失敗しました（APIキーや通信を確認してください: '+e.status+'）。':'読み取りに失敗しました。PDFの場合は、画面のスクリーンショットでもお試しください。',1);
  }finally{scanning=false}
}
function openScanReview(items,pay){
  const v={pay:(pay&&payOpts().some(o=>o[0]===pay))?pay:(payOpts()[0]||[''])[0]};items.forEach((_,i)=>v['i'+i]=true);
  openForm({title:'読み取り結果（'+items.length+'件）',vals:v,
    fields:()=>[{k:'pay',label:'支払い方法・入金先',type:'select',options:payOpts()},
      ...items.map((it,i)=>({type:'check',k:'i'+i,label:`${mdLabel(it.date)}　${it.name||'（名称なし）'}　${yen(it.amount)}${it.type==='income'?'（収入）':'　'+catName(it.cat)}`})),
      {type:'info',html:'チェックを外した行は取り込まれません。保存したあとも、取引から1件ずつ直せます。'}],
    save:v=>{
      const sel=items.filter((_,i)=>v['i'+i]);if(!sel.length)return'取り込む行を選んでください';
      const accId=(S.accounts[0]||{}).id;
      sel.forEach(it=>{
        const card=v.pay[0]==='c'&&it.type==='expense'?v.pay.slice(2):null,acc=card?null:(v.pay[0]==='a'?v.pay.slice(2):accId);
        S.txns.push({id:uid('t'),date:it.date,type:it.type,amount:it.amount,memo:it.name,tags:it.tags,cat:it.type==='expense'?it.cat:null,loan:null,acc,card});
      });
      tab='txns';mon=ymOf(sel[0].date)}});
}
function openChooser(){
  F=null;
  const has=S.accounts.length>0;
  const row=(a,ic,t)=>`<button class="li" data-a="chopen:${a}"><span class="ic">${ic}</span><div class="l"><div class="t">${t}</div></div><span class="mute">›</span></button>`;
  let h=`<div class="backdrop" data-a="closech"></div><div class="sheet" role="dialog" aria-label="入力"><div class="sh-h"><button data-a="closech">キャンセル</button><b>入力</b><span style="width:70px"></span></div><div class="sh-b">`;
  if(has){
    h+=`<div class="dh" style="margin-top:0">お金の出入りを記録する（入力方法をえらぶ）</div>
  <button class="bigbtn" data-a="newtxn:manual"><span class="bi">✍️</span><span>手入力<small>金額やカテゴリを自分で入れる</small></span></button>
  <label class="bigbtn"><span class="bi">📷</span><span>写真・PDF<small>レシートや明細を撮る・選ぶと自動入力</small></span><input type="file" accept="image/*,application/pdf" multiple data-chscan="1" style="display:none"></label>
  <button class="bigbtn" data-a="newtxn:voice"><span class="bi">🎤</span><span>声・文章<small>「昨日 スーパーで3800円」と話す・打つ</small></span></button>
  <div class="dh">そのほかの入力（手入力）</div><div class="list">${row('acc','🏧','口座を追加')}${row('card','💳','カードを追加')}${row('cardbulk','💳','カードの締め日・支払日をまとめて登録')}${row('loan','🏦','ローンを追加')}${row('rec','📌','毎月の固定（給料・家賃など）を追加')}${row('budget','🎯','予算を設定')}</div>`;
  }else{
    h+=`<div class="dh" style="margin-top:0">はじめに、口座を追加しましょう</div><div class="list">${row('acc','🏧','口座を追加（いまの残高を入力）')}</div><div class="note">口座を追加すると、取引の記録（手入力・写真・声）や、カード・ローンなどの入力が使えるようになります。</div>`;
  }
  $('#sheet').innerHTML=h+`</div></div>`;
  $('#sheet').classList.remove('hidden');
}
function focusVoice(){const i=document.querySelector('[data-voice]');if(i&&i.focus)i.focus()}
function openBudget(){
  const v={};S.cats.forEach(c=>v['b_'+c.id]=S.budgets[c.id]||'');
  openForm({title:'月の予算',vals:v,fields:()=>S.cats.map(c=>({k:'b_'+c.id,label:c.name,type:'number',ph:'未設定'})),
    save:v=>{S.cats.forEach(c=>{const n=num(v['b_'+c.id]);if(n>0)S.budgets[c.id]=n;else delete S.budgets[c.id]})}});
}

/* ===== イベント ===== */
document.addEventListener('click',e=>{
  const sh=e.target.closest('#sheet');
  if(sh&&F){
    const b=e.target.closest('button');if(!b&&!e.target.dataset.close)return;
    const el=e.target.closest('[data-close],[data-save],[data-del],[data-seg],[data-tag],[data-vb],[data-payk]');if(!el)return;
    if(el.dataset.payk){F.vals[el.dataset.payk]=el.dataset.v;renderSheet();return}
    if(el.dataset.vb){if(el.dataset.vb==='mic')startMic();else applyVoice((F&&F.voiceText)||'');return}
    if(el.dataset.tag){const ts=parseTags(F.vals.tags),k=ts.indexOf(el.dataset.tag);if(k>=0)ts.splice(k,1);else ts.push(el.dataset.tag);F.vals.tags=tagStr(ts);renderSheet();return}
    if(el.dataset.close){closeForm();return}
    if(el.dataset.seg){F.vals[el.dataset.seg]=el.dataset.v;renderSheet();if(el.dataset.seg==='method'&&el.dataset.v==='voice')focusVoice();return}
    if(el.dataset.save){const r=F.save(F.vals);if(r){$('#err').textContent=r;return}if(typeof gen==='function')gen();save();closeForm();render();return}
    if(el.dataset.del){
      if(!el.dataset.ok){el.dataset.ok=1;el.textContent='本当に削除する？もう一度タップ';return}
      const r=F.del();if(r){$('#err').textContent=r;el.dataset.ok='';el.textContent='削除';return}save();closeForm();render();return}
    return;
  }
  const el=e.target.closest('[data-a]');if(!el)return;
  const[a,arg]=el.dataset.a.split(':');
  if(a==='tab'){tab=arg;render();window.scrollTo(0,0)}
  else if(a==='mon'){mon=addM(mon,Number(arg));render()}
  else if(a==='pf'){pf=arg;render()}
  else if(a==='choose')openChooser();
  else if(a==='closech')closeForm();
  else if(a==='chopen'){closeForm();({acc:openAcc,card:openCard,cardbulk:openCardBulk,loan:openLoan,rec:openRec})[arg]?({acc:openAcc,card:openCard,cardbulk:openCardBulk,loan:openLoan,rec:openRec})[arg](null):openBudget()}
  else if(a==='newtxn'){closeForm();openTxn(null,arg);if(arg==='voice')focusVoice()}
  else if(a==='txn')openTxn(arg==='new'?null:arg);
  else if(a==='acc')openAcc(arg==='new'?null:arg);
  else if(a==='card')openCard(arg==='new'?null:arg);
  else if(a==='loan')openLoan(arg==='new'?null:arg);
  else if(a==='rec')openRec(arg==='new'?null:arg);
  else if(a==='budget')openBudget();
  else if(a==='catadd'){S.cats.push({id:uid('e'),name:'新しいカテゴリ',icon:'🏷️'});save();render()}
  else if(a==='tf'){tf=arg||'';render()}
  else if(a==='tagdel'){
    if(!el.dataset.ok){el.dataset.ok=1;el.textContent='本当に？';return}
    const fix=x=>{if(x.tags)x.tags=x.tags.filter(t=>t!==arg)};S.txns.forEach(fix);S.recs.forEach(fix);if(tf===arg)tf='';save();render()}
  else if(a==='catdel'){
    if(!el.dataset.ok){el.dataset.ok=1;el.textContent='本当に？';return}
    if(S.txns.some(x=>x.cat===arg)||S.recs.some(r=>r.cat===arg)){$('#msg').textContent='このカテゴリの取引があるため削除できません';return}
    S.cats=S.cats.filter(c=>c.id!==arg);delete S.budgets[arg];save();render()}
  else if(a==='wipe'){
    if(!el.dataset.ok){el.dataset.ok=1;el.firstChild.textContent='本当に削除しますか？もう一度タップ';return}
    S=empty();save();tab='home';render()}
  else if(a==='import')openImport();
  else if(a==='export'){
    const txt=JSON.stringify(S);
    try{navigator.clipboard.writeText(txt).then(()=>{$('#msg').textContent='コピーしました。メモアプリなどに貼り付けて保管できます。'},()=>{$('#msg').textContent='コピーできませんでした'})}catch(err){$('#msg').textContent='コピーできませんでした'}}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(F&&el.dataset.k){F.vals[el.dataset.k]=el.type==='checkbox'?el.checked:el.value}
  else if(F&&el.dataset.voice!=null){F.voiceText=el.value}
  else if(el.dataset.apikey!=null){try{localStorage.setItem(KEYLS,el.value.trim())}catch(err){}}
  else if(el.dataset.cat){const c=S.cats.find(x=>x.id===el.dataset.cat);if(c){c.name=el.value;save()}}
  else if(el.dataset.cicon){const c=S.cats.find(x=>x.id===el.dataset.cicon);if(c){c.icon=el.value.trim();save()}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.chscan!=null){const fs=Array.from(el.files||[]);el.value='';if(!fs.length)return;closeForm();openTxn(null,'photo');handleScan(fs);return}

    const old=el.dataset.tagname,nw=parseTags(el.value)[0];
    if(nw&&nw!==old){const fix=a=>{if(!a||!a.includes(old))return a;const r=a.map(t=>t===old?nw:t);return r.filter((t,i)=>r.indexOf(t)===i)};S.txns.forEach(x=>{x.tags=fix(x.tags)});S.recs.forEach(r=>{r.tags=fix(r.tags)});if(tf===old)tf=nw;save()}
    render();
  }
});
