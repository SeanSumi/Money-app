<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<title>マネー管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="マネー管理">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2330;--mute:#7a8494;--line:#e8eaee;--acc:#2f6fd0;--pos:#1a8f5c;--neg:#d9453b;--field:#f0f2f5;--warn:#c9831a;--grad:#2f6fd0}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#1a1f27;--ink:#eef1f5;--mute:#94a0b0;--line:#2a313c;--acc:#6ea3f5;--pos:#4cc79a;--neg:#f08a6c;--field:#242b35;--warn:#e8b04a;--grad:#2f5fb8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 0 calc(170px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:620px;margin:0 auto;padding:0 16px}
.title{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 8px}
.title h1{font-size:30px;margin:0;letter-spacing:-.5px}
.title small{color:var(--mute);font-size:12px}
.gear{border:0;background:var(--card);border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--mute);margin-left:10px}
.title .rt{display:flex;align-items:center}
.sec{font-size:13px;color:var(--mute);margin:20px 4px 6px;display:flex;justify-content:space-between;align-items:center}
.sec button{border:0;background:none;color:var(--acc);font-size:15px;padding:0}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
button.li:active{background:var(--field)}
.li .l{min-width:0;flex:1}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--mute)}
.li .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.hero{background:var(--card);border-radius:16px;padding:18px}
.hero .lab{font-size:13px;color:var(--mute)}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cols div{background:var(--field);border-radius:10px;padding:8px 10px}
.cols span{font-size:11px;color:var(--mute);display:block}
.cols b{font-size:15px;font-variant-numeric:tabular-nums}
.dh{font-size:12px;color:var(--mute);margin:14px 4px 4px}
.bar{height:7px;background:var(--field);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar i.over{background:var(--neg)}.bar i.near{background:var(--warn)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mnav b{font-size:17px}
.ib{border:0;background:var(--card);border-radius:10px;width:40px;height:36px;font-size:18px;color:var(--acc)}
.empty{background:var(--card);border-radius:16px;padding:26px 18px;text-align:center}
.empty p{color:var(--mute);margin:6px 0 14px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.sec2{background:var(--field);color:var(--acc)}
.btn.danger{background:var(--field);color:var(--neg)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.steps{text-align:left;margin:10px 0 16px;padding-left:20px;color:var(--mute);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0 9px;min-height:64px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button span{font-size:26px;line-height:1.1}
nav button.on{color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--card);border-radius:14px;padding:6px}
.cal .wd{text-align:center;font-size:11px;color:var(--mute);padding:3px 0}
.cal button{border:0;background:none;min-height:58px;border-radius:9px;padding:3px 1px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font-size:13px;overflow:hidden}
.cal button.sel{background:var(--field);outline:2px solid var(--acc)}
.cal button.today b{background:var(--acc);color:#fff;border-radius:10px;padding:0 6px}
.cal button.out{visibility:hidden}
.cal .am{font-size:10px;color:var(--mute);white-space:nowrap}
.cal .mk{font-size:11px;line-height:1;height:12px;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:6}
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.hidden{display:none}
.gi{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.ic .gi{width:22px;height:22px;color:var(--acc)}
.bigbtn .bi .gi{width:28px;height:28px;color:var(--acc)}
nav button span .gi{width:25px;height:25px;vertical-align:middle}
.emobtn .gi{width:24px;height:24px;color:var(--acc)}
.epk .eg button .gi{width:28px;height:28px;color:var(--ink)}
.epk .et button .gi{width:24px;height:24px;color:var(--mute)}
.epk .et button.on .gi{color:var(--acc)}
.vb .gi,.scan .gi{width:22px;height:22px}
#epick{z-index:40}
.epk{position:relative;background:var(--bg);width:100%;max-width:620px;max-height:80vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.epk .eh{display:flex;gap:8px;align-items:center;padding:12px 14px 6px}
.epk .eh input{flex:1;font-size:22px;text-align:center;background:var(--field);border:0;border-radius:10px;padding:8px;min-width:0}
.epk .eh button{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px}
.epk .et{display:flex;gap:4px;overflow-x:auto;padding:4px 10px}
.epk .et button{flex:none;border:0;background:none;font-size:20px;padding:6px 9px;border-radius:9px}
.epk .et button.on{background:var(--field)}
.epk .eg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;overflow-y:auto;padding:6px 10px 14px}
.epk .eg button{border:0;background:none;font-size:27px;padding:7px 0;border-radius:10px}
.epk .eg button:active{background:var(--field)}
.epk .hint{font-size:11px;color:var(--mute);padding:0 16px 2px}
.emobtn{border:0;background:var(--field);border-radius:10px;font-size:22px;padding:4px 14px}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:620px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.sh-h button{border:0;background:none;color:var(--acc);font-size:16px;padding:4px}
.sh-h button.pri{font-weight:700}
.sh-b{overflow:auto;padding:0 16px 24px}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f label{flex:none;color:var(--ink)}
.f input,.f select{flex:1;min-width:0;border:0;background:none;text-align:right;padding:2px 0;outline:none;color:var(--ink)}
.f input::placeholder{color:var(--mute)}
.f.amt input{font-size:28px;font-weight:700}
.seg{display:flex;background:var(--field);border-radius:9px;padding:2px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:7px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.info{padding:12px 14px;font-size:13px;color:var(--mute)}
.info b{color:var(--ink)}
.err{color:var(--neg);font-size:13px;margin:8px 4px;min-height:18px}
.delbtn{margin-top:14px;width:100%}
.catrow{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow input{flex:1;border:0;background:none;outline:none;min-width:0}
.catrow button{border:0;background:none;color:var(--neg);font-size:15px}
.note{font-size:12px;color:var(--mute);margin:8px 4px}

.list{border-radius:20px;box-shadow:none}
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:20px;box-shadow:none}
.hero .lab{color:rgba(255,255,255,.88);font-weight:600}
.hero .big{font-size:40px;font-weight:800}
.hero .cols div{background:rgba(255,255,255,.2)}
.hero .cols span{color:rgba(255,255,255,.88)}
.hero .pos,.hero .neg{color:#fff}
.title h1{font-weight:800}
.ic{width:38px;height:38px;border-radius:13px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.bar{height:9px;border-radius:5px}
.bar i{background:var(--grad)}
.bar i.near{background:var(--warn)}
.bar i.over{background:var(--neg)}
.btn{background:var(--grad);border-radius:14px;box-shadow:none}
.btn.sec2{background:var(--field);color:var(--acc);box-shadow:none}
.btn.danger{background:var(--field);color:var(--neg);box-shadow:none}
.fab{background:var(--grad);box-shadow:0 4px 12px rgba(20,30,60,.25);width:60px;height:60px;border-radius:30px}
nav button.on span{background:var(--field);border-radius:14px;padding:0 16px}
.seg button.on{color:var(--acc)}
.sec{font-weight:700}
.empty{border-radius:24px;box-shadow:none}
.sheet{border-radius:24px 24px 0 0}
.ib,.gear{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button,.chiprow button{border:0;background:var(--field);color:var(--mute);border-radius:999px;padding:6px 13px;font-size:13px;flex:none}
.chips button.on,.chiprow button.on{background:var(--acc);color:#fff}
.chiprow{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.catrow .emo{flex:none;width:44px;text-align:center;font-size:20px;background:var(--field);border-radius:10px;padding:4px 0}
.catrow .cnt{font-size:12px;color:var(--mute);flex:none}
.scan{display:block;text-align:center;background:var(--field);color:var(--acc);border-radius:14px;padding:12px;font-weight:600;margin:0 0 6px;cursor:pointer}
.scanmsg{font-size:13px;color:var(--mute);min-height:18px;margin:0 4px 10px}
.scanmsg.bad{color:var(--neg)}
.voice{display:flex;gap:6px;margin:0 0 6px}
.voice textarea{flex:1;min-width:0;background:var(--field);border:0;border-radius:12px;padding:11px 12px;outline:none;color:var(--ink);font:inherit;resize:none}
.voice .vb{border:0;background:var(--field);border-radius:12px;padding:0 14px;font-size:18px}
.voice .go{font-size:14px;color:var(--acc);font-weight:600}
.bigbtn{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px 16px;margin:0 0 10px;width:100%;border:0;text-align:left;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer}
.bigbtn .bi{font-size:30px;width:52px;height:52px;border-radius:15px;background:var(--field);display:flex;align-items:center;justify-content:center;flex:none}
.bigbtn small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
.area{display:block;width:100%;background:var(--card);border:0;border-radius:14px;padding:12px;font:inherit;color:var(--ink);resize:vertical;outline:none;min-height:130px;margin:0 0 10px}
.seg.sc{overflow-x:auto}
.seg.sc button{flex:none;padding:7px 12px;white-space:nowrap}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" id="fab" data-a="choose" aria-label="取引を追加">＋</button>
<nav id="nav">
  <button data-a="tab:home" data-t="home"><span>🏠</span>ホーム</button>
  <button data-a="tab:txns" data-t="txns"><span>🧾</span>取引</button>
  <button data-a="tab:pay" data-t="pay"><span>📈</span>収支</button>
  <button data-a="tab:cal" data-t="cal"><span>📅</span>カレンダー</button>
  <button data-a="tab:assets" data-t="assets"><span>👛</span>資産</button>
</nav>
<div class="sheet-wrap hidden" id="sheet"></div>
<div class="sheet-wrap hidden" id="epick"></div>

<script>
const LS='money-app-v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const num=v=>Number(v)||0;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pad=n=>String(n).padStart(2,'0');
let TODAY_O=null;
const today=()=>{if(TODAY_O)return TODAY_O;const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ymOf=d=>d.slice(0,7);
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dim=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const dayStr=(m,day)=>m+'-'+pad(Math.max(1,Math.min(day,dim(m))));
const ymLabel=k=>k.slice(0,4)+'年'+Number(k.slice(5))+'月';
const mdLabel=d=>Number(d.slice(5,7))+'/'+Number(d.slice(8));
const WD=['日','月','火','水','木','金','土'];
const dLabel=d=>{const[y,m,dd]=d.split('-').map(Number);return m+'月'+dd+'日（'+WD[new Date(y,m-1,dd).getDay()]+'）'};

function empty(){return{v:2,accounts:[],cards:[],loans:[],recs:[],txns:[],budgets:{},
  cats:[{id:'e1',name:'住居'},{id:'e2',name:'食費'},{id:'e3',name:'光熱・通信'},{id:'e4',name:'交通'},{id:'e5',name:'日用品'},{id:'e6',name:'娯楽・交際'},{id:'e8',name:'維持費',icon:'🔧'},{id:'e7',name:'その他'}],mig8:1}}
let S=empty(),tab='home',mon=ymOf(today()),F=null,pf='all',tf='';

/* ===== 計算 ===== */
function stmtOf(c,d){
  const ym=ymOf(d),day=Number(d.slice(8)),close=num(c.closing);
  const cm=(close===0||day<=close)?ym:addM(ym,1);
  return{key:cm,pay:dayStr(addM(cm,c.offset==null?1:num(c.offset)),num(c.payDay)||27)};
}
function cardCycle(c){
  const t=today(),cur=stmtOf(c,t),close=num(c.closing);
  const closeDate=dayStr(cur.key,close===0?31:close);
  const i=cardInfo(c),open=i.st.find(x=>x.key===cur.key);
  const days=Math.round((new Date(closeDate)-new Date(t))/86400000);
  return{closeDate,days,use:open?open.total:0,n:open?open.n:0,pay:cur.pay};
}
function cardInfo(c){
  const m={},t=today();
  S.txns.forEach(x=>{if(x.type==='expense'&&x.card===c.id&&x.date<=t){const s=stmtOf(c,x.date);const e=m[s.key]||(m[s.key]={key:s.key,pay:s.pay,total:0,n:0});e.total+=x.amount;e.n++}});
  const st=Object.values(m).sort((a,b)=>a.pay<b.pay?-1:1),up=st.filter(s=>s.pay>t);
  return{st,unpaid:up.reduce((a,s)=>a+s.total,0),debited:st.filter(s=>s.pay<=t).reduce((a,s)=>a+s.total,0),next:up[0]||null};
}
function accBal(a,withoutOpening){
  const t=today();let b=withoutOpening?0:num(a.opening);
  S.txns.forEach(x=>{if(x.date>t||x.acc!==a.id)return;if(x.type==='income')b+=x.amount;else b-=x.amount});
  S.cards.forEach(c=>{if(c.acc===a.id)b-=cardInfo(c).debited});
  return b;
}
function loanState(l){
  let bal=num(l.bal0),pi=0,pp=0;const t=today();
  S.txns.filter(x=>x.type==='loanpay'&&x.loan===l.id&&x.date>l.asOf&&x.date<=t).sort((a,b)=>a.date<b.date?-1:1).forEach(x=>{
    const int=Math.round(bal*num(l.rate)/100/12),pr=Math.max(0,Math.min(bal,x.amount-int));bal-=pr;pp+=pr;pi+=x.amount-pr});
  return{bal,paidInt:pi,paidPrin:pp};
}
function loanProj(l,bal){
  if(bal<=0)return{done:true};
  const r=num(l.rate)/100/12,p=num(l.monthly);if(p<=0)return null;
  let n=0,ti=0,b=bal;
  while(b>0&&n<600){const i=Math.round(b*r);if(p<=i)return{never:true};ti+=i;b-=p-i;n++}
  return{n,ti,end:addM(ymOf(today()),n)};
}
function mSum(m){
  let inc=0,exp=0,rep=0;const byCat={};
  S.txns.forEach(t=>{if(ymOf(t.date)!==m)return;if(t.type==='income')inc+=t.amount;else if(t.type==='expense'){exp+=t.amount;byCat[t.cat]=(byCat[t.cat]||0)+t.amount}else rep+=t.amount});
  return{inc,exp,rep,byCat};
}
function txnClass(x){
  if(x.type==='loanpay')return'loan';
  if(x.type!=='expense')return'';
  const an=(S.accounts.find(a=>a.id===x.acc)||{}).name;
  if(isFixedName(x.memo)||isFixedName(catName(x.cat))||(x.src&&!isLoanName(x.memo)))return'fixed';
  if(isLoanName(x.memo)||isLoanName(an))return'loan';
  return'var';
}
function monthSplit(m){
  const o={inc:0,vari:0,fixed:0,loan:0,fixedPlan:0,loanPlan:0};
  S.txns.forEach(x=>{if(ymOf(x.date)!==m)return;if(x.type==='income'){o.inc+=x.amount;return}const c=txnClass(x);if(c==='fixed')o.fixed+=x.amount;else if(c==='loan')o.loan+=x.amount;else if(c==='var')o.vari+=x.amount});
  paymentsOf(m).forEach(p=>{if(p.done||String(p.act).startsWith('txn:'))return;if(p.kind==='fixed')o.fixedPlan+=p.amount;else if(p.kind==='loan')o.loanPlan+=p.amount});
  return o;
}
function totals(){
  const assets=S.accounts.reduce((a,x)=>a+accBal(x),0),cards=S.cards.reduce((a,c)=>a+cardInfo(c).unpaid,0),loans=S.loans.reduce((a,l)=>a+loanState(l).bal,0);
  return{assets,cards,loans,net:assets-cards-loans};
}

let lastSync=0;
function syncAuto(){
  const t=today(),cur=ymOf(t);let n=0;
  S.txns.slice().forEach(x=>{
    if(!x.src||x.man||ymOf(x.date)<cur)return;
    const r=S.recs.find(y=>y.id===x.src),l=S.loans.find(y=>y.id===x.src);
    if(r&&x.type!=='loanpay'){
      const o={type:r.type,amount:num(r.amount),cat:r.cat||null,acc:r.card?null:r.acc,card:r.card||null,memo:r.name,tags:(r.tags||[]).slice(),date:dayStr(ymOf(x.date),num(r.day)||1)};
      if(Object.keys(o).some(k=>JSON.stringify(o[k])!==JSON.stringify(x[k]==null?(k==='card'||k==='acc'||k==='cat'?null:x[k]):x[k]))){Object.assign(x,o);n++}
    }else if(l&&x.type==='loanpay'){
      if(num(l.monthly)<=0){if(x.date>t){S.txns=S.txns.filter(y=>y.id!==x.id);n++}return}
      const o={amount:num(l.monthly),acc:l.acc,date:dayStr(ymOf(x.date),num(l.payDay)||1)};
      if(o.amount!==x.amount||o.acc!==x.acc||o.date!==x.date){Object.assign(x,o);n++}
    }else if(!r&&!l&&x.date>t){S.txns=S.txns.filter(y=>y.id!==x.id);n++}
  });
  lastSync=n;return n>0;
}
function gen(){
  const t=today(),cur=ymOf(t);let ch=syncAuto();
  const run=(src,kind)=>{
    let m=src.last?addM(src.last,1):(kind==='loan'?ymOf(src.asOf):(src.startYm||cur));
    if(m<addM(cur,-36))m=addM(cur,-36);
    while(m<=cur){
      const d=dayStr(m,num(src.day||src.payDay)||1);
      if(d>t)break;
      if(!(kind==='loan'&&d<=src.asOf)){
        if(kind==='loan')S.txns.push({id:uid('t'),date:d,type:'loanpay',amount:num(src.monthly),loan:src.id,acc:src.acc,memo:'',src:src.id});
        else S.txns.push({id:uid('t'),date:d,type:src.type,amount:num(src.amount),cat:src.cat,acc:src.card?null:src.acc,card:src.card||null,memo:src.name,tags:(src.tags||[]).slice(),src:src.id});
      }
      src.last=m;m=addM(m,1);ch=true;
    }
  };
  S.recs.forEach(r=>run(r,'rec'));
  S.loans.forEach(l=>{if(num(l.monthly)>0&&l.payDay)run(l,'loan')});
  return ch;
}

function parseCardLine(line){
  let t=normSpeech(line).replace(/[　]/g,' ').trim();if(!t)return null;
  let m,offset=null,closing=null,payDay=null;
  if((m=t.match(/翌々月/))){offset=2;t=t.replace(m[0],' ')}
  else if((m=t.match(/翌月|来月/))){offset=1;t=t.replace(m[0],' ')}
  else if((m=t.match(/当月|今月|同月/))){offset=0;t=t.replace(m[0],' ')}
  if((m=t.match(/(\d{1,2})\s*日?\s*締め?/))){closing=num(m[1]);t=t.replace(m[0],' ')}
  else if((m=t.match(/(?:月末|末)\s*日?\s*締め?/))){closing=0;t=t.replace(m[0],' ')}
  if((m=t.match(/(\d{1,2})\s*日?\s*(?:支払い?|払い?|引き?落とし?|引落)/))){payDay=num(m[1]);t=t.replace(m[0],' ')}
  if(closing===null||payDay===null||payDay<1||payDay>31||closing>31)return null;
  if(offset===null)offset=(closing>0&&payDay>closing)?0:1;
  const name=t.replace(/[、,:：]/g,' ').replace(/\s+/g,' ').trim().replace(/(の)?(支払い?|払い)$/,'').trim();
  if(!name)return null;
  return{name,closing,payDay,offset};
}
function takeYen(t){
  let m,v=null;
  if((m=t.match(/(\d+(?:\.\d+)?)\s*万\s*(\d+)\s*千\s*円?/)))v=Math.round(parseFloat(m[1])*10000)+num(m[2])*1000;
  else if((m=t.match(/(\d+(?:\.\d+)?)\s*万\s*(\d{1,4})?\s*円?/)))v=Math.round(parseFloat(m[1])*10000)+(m[2]?num(m[2]):0);
  else if((m=t.match(/(\d+)\s*千\s*円?/)))v=num(m[1])*1000;
  else if((m=t.match(/(\d+)\s*円/)))v=num(m[1]);
  else if((m=t.match(/(\d{4,})/)))v=num(m[1]);
  else if((m=t.match(/(?:^|\s)(\d{1,3})(?:\s|$)/)))v=num(m[1]);
  return v===null?{v:null,t}:{v,t:t.replace(m[0],' ')};

function kanji2num(str){
  const d={'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  let total=0,sec=0,cur=0;
  for(const ch of str){
    if(ch in d)cur=d[ch];
    else if(ch==='十'){sec+=(cur||1)*10;cur=0}
    else if(ch==='百'){sec+=(cur||1)*100;cur=0}
    else if(ch==='千'){sec+=(cur||1)*1000;cur=0}
    else if(ch==='万'){total+=((sec+cur)||1)*10000;sec=0;cur=0}
  }
  return total+sec+cur;
}
function normSpeech(t){

}
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function extractDate(t){
  const T=today(),now=new Date();let m,date=null;
  const rel=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
  if((m=t.match(/一昨日|おととい/))){date=rel(-2)}
  else if((m=t.match(/昨日|きのう/))){date=rel(-1)}
  else if((m=t.match(/今日|きょう|本日/))){date=T}
  else if((m=t.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))){
    const y=num(m[1]),mo=num(m[2]),dd=num(m[3]);
    date=y+'-'+pad(mo)+'-'+pad(Math.min(dd,dim(y+'-'+pad(mo))));
  }
  else if((m=t.match(/(^|[^\d\/])(\d{1,2})\/(\d{1,2})(?![\d\/])/))&&num(m[2])>=1&&num(m[2])<=12&&num(m[3])>=1&&num(m[3])<=31){
    const y=now.getFullYear(),mo=num(m[2]),dd=num(m[3]);
    let ds=y+'-'+pad(mo)+'-'+pad(Math.min(dd,dim(y+'-'+pad(mo))));
    if(ds>rel(31))ds=(y-1)+ds.slice(4);
    date=ds;
  }
  else if((m=t.match(/(?:(\d{4})年)?\s*(\d{1,2})月\s*(\d{1,2})日/))){
    let y=m[1]?num(m[1]):now.getFullYear();const mo=num(m[2]),dd=num(m[3]);
    let ds=y+'-'+pad(mo)+'-'+pad(Math.min(dd,dim(y+'-'+pad(mo))));
    if(!m[1]&&ds>rel(31))ds=(y-1)+ds.slice(4);
    date=ds;
  }else if((m=t.match(/(\d{1,2})日(?!間|前)/))){
    const dd=num(m[1]);let ym=ymOf(T);let ds=dayStr(ym,dd);
    if(ds>T){ym=addM(ym,-1);ds=dayStr(ym,dd)}
    date=ds;
  }
  return{date,t:m?t.replace(m[0],' '):t};
}

  F=null;
  const has=S.accounts.length>0;
  const row=(a,ic,t)=>`<button class="li" data-a="chopen:${a}"><span class="ic">${ic}</span><div class="l"><div class="t">${t}</div></div><span class="mute">›</span></button>`;
  let h=`<div class="backdrop" data-a="closech"></div><div class="sheet" role="dialog" aria-label="入力"><div class="sh-h"><button data-a="closech">キャンセル</button><b>入力</b><span style="width:70px"></span></div><div class="sh-b">`;
  if(has){
    h+=`<div class="dh" style="margin-top:0">お金の出入りを記録する（入力方法をえらぶ）</div>
  <button class="bigbtn" data-a="newtxn:manual"><span class="bi">✍️</span><span>手入力<small>金額やカテゴリを自分で入れる</small></span></button>
  <label class="bigbtn"><span class="bi">📷</span><span>写真・PDF<small>レシートや明細を撮る・選ぶと自動入力</small></span><input type="file" accept="image/*,application/pdf" multiple data-chscan="1" style="display:none"></label>
  <button class="bigbtn" data-a="newtxn:voice"><span class="bi">🎤</span><span>声・文章<small>「昨日 スーパーで3800円」と話す・打つ</small></span></button>
  <div class="dh">そのほかの入力（手入力）</div><div class="list">${row('acc','🏧','口座を追加')}${row('card','💳','カードを追加')}${row('cardbulk','💬','口座・カード・ローンをまとめて登録（文章でOK）')}${row('loan','🏦','ローンを追加')}${row('rec','📌','毎月の固定（給料・家賃など）を追加')}${row('budget','🎯','予算を設定')}</div>`;
  }else{
    h+=`<div class="dh" style="margin-top:0">はじめに、口座を追加しましょう</div><div class="list">${row('acc','🏧','口座を追加（いまの残高を入力）')}</div><div class="note">口座を追加すると、取引の記録（手入力・写真・声）や、カード・ローンなどの入力が使えるようになります。</div>`;
  }
  $('#sheet').innerHTML=deco(h+`</div></div>`);
  $('#sheet').classList.remove('hidden');
}
function focusVoice(){const i=document.querySelector('[data-voice]');if(i&&i.focus)i.focus()}
function openBudget(){
  const v={};S.cats.forEach(c=>v['b_'+c.id]=S.budgets[c.id]||'');
  openForm({title:'月の予算',vals:v,fields:()=>S.cats.map(c=>({k:'b_'+c.id,label:c.name,type:'number',ph:'未設定'})),
    save:v=>{S.cats.forEach(c=>{const n=num(v['b_'+c.id]);if(n>0)S.budgets[c.id]=n;else delete S.budgets[c.id]})}});
}

/* ===== イベント ===== */
document.addEventListener('click',e=>{
  const sh=e.target.closest('#sheet');
  if(sh&&F){
    const b=e.target.closest('button');if(!b&&!e.target.dataset.close)return;
    const el=e.target.closest('[data-close],[data-save],[data-del],[data-seg],[data-tag],[data-vb],[data-payk]');if(!el)return;
    if(el.dataset.payk){F.vals[el.dataset.payk]=el.dataset.v;renderSheet();return}
    if(el.dataset.vb){if(el.dataset.vb==='mic')startMic();else applyVoice((F&&F.voiceText)||'');return}
    if(el.dataset.tag){const ts=parseTags(F.vals.tags),k=ts.indexOf(el.dataset.tag);if(k>=0)ts.splice(k,1);else ts.push(el.dataset.tag);F.vals.tags=tagStr(ts);renderSheet();return}
    if(el.dataset.close){closeForm();return}
    if(el.dataset.favf!=null){const x=favs(8)[Number(el.dataset.favf)];if(x){Object.assign(F.vals,favTpl(x));renderSheet()}return}
    if(el.dataset.copy){if(F.copy)F.copy();return}
    if(el.dataset.emok){const k=el.dataset.emok;pickEmoji(F.vals[k],x=>{F.vals[k]=x;renderSheet()});return}
    if(el.dataset.seg){F.vals[el.dataset.seg]=el.dataset.v;renderSheet();if(el.dataset.seg==='method'&&el.dataset.v==='voice')focusVoice();return}
    if(el.dataset.save){const r=F.save(F.vals);if(r){$('#err').textContent=r;return}if(typeof gen==='function')gen();save();closeForm();render();return}
    if(el.dataset.del){
      if(!el.dataset.ok){el.dataset.ok=1;el.textContent='本当に削除する？もう一度タップ';return}
      const r=F.del();if(r){$('#err').textContent=r;el.dataset.ok='';el.textContent='削除';return}save();closeForm();render();return}
    return;
  }
  const ce=e.target.closest('[data-cemo]');
  if(ce){const c=S.cats.find(x=>x.id===ce.dataset.cemo);if(c)pickEmoji(c.icon,x=>{c.icon=x;save();render()});return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const[a,arg]=el.dataset.a.split(':');
  if(a==='tab'){tab=arg;render();window.scrollTo(0,0)}
  else if(a==='mon'){mon=addM(mon,Number(arg));render()}
  else if(a==='pf'){pf=arg;render()}
  else if(a==='choose')openChooser();
  else if(a==='closech')closeForm();
  else if(a==='chopen'){closeForm();({acc:openAcc,card:openCard,cardbulk:openAssetBulk,loan:openLoan,rec:openRec})[arg]?({acc:openAcc,card:openCard,cardbulk:openAssetBulk,loan:openLoan,rec:openRec})[arg](null):openBudget()}
  else if(a==='newtxn'){closeForm();openTxn(null,arg);if(arg==='voice')focusVoice()}
  else if(a==='txn')openTxn(arg==='new'?null:arg);
  else if(a==='acc')openAcc(arg==='new'?null:arg);
  else if(a==='card')openCard(arg==='new'?null:arg);
  else if(a==='loan')openLoan(arg==='new'?null:arg);
  else if(a==='rec')openRec(arg==='new'?null:arg);
  else if(a==='budget')openBudget();
  else if(a==='catadd'){S.cats.push({id:uid('e'),name:'新しいカテゴリ',icon:'🏷️'});save();render()}
  else if(a==='tf'){tf=arg||'';render()}
  else if(a==='cal'){calDay=arg.length>8?arg:calDay;render()}
  else if(a==='abk'){
    const err=applyAssetText(abkText,mainAcc()&&mainAcc().id);
    if(err){abkMsg='!'+err;render();return}
    const its=parseAssetText(abkText),n=its.filter(x=>x.kind!=='bad').length,bad=its.length-n;
    abkText='';abkMsg=n+'件を登録・変更しました'+(bad?'（読み取れない'+bad+'行は反映していません）':'')+(abkWarn.length?'　'+abkWarn.join('／'):'')+(lastSync?'　（今月以降の自動記録 '+lastSync+'件も更新しました）':'');tab='assets';save();render();window.scrollTo(0,0)}
  else if(a==='apie'){apie=arg;render()}
  else if(a==='payday'){openRec(null,{type:'income',name:'給与',day:10,pay:mainAcc()?'a:'+mainAcc().id:''})}
  else if(a==='cf'){cf=arg||'';render()}
  else if(a==='fav'){const f=favs(6)[Number(arg)];if(f)openTxn(null,'manual',favTpl(f))}
  else if(a==='srt'){srt=arg;render()}
  else if(a==='allp'){allp=arg==='1';render()}
  else if(a==='tagdel'){
    if(!el.dataset.ok){el.dataset.ok=1;el.textContent='本当に？';return}
    const fix=x=>{if(x.tags)x.tags=x.tags.filter(t=>t!==arg)};S.txns.forEach(fix);S.recs.forEach(fix);if(tf===arg)tf='';save();render()}
  else if(a==='catdel'){
    if(!el.dataset.ok){el.dataset.ok=1;el.textContent='本当に？';return}
    if(S.txns.some(x=>x.cat===arg)||S.recs.some(r=>r.cat===arg)){$('#msg').textContent='このカテゴリの取引があるため削除できません';return}
    S.cats=S.cats.filter(c=>c.id!==arg);delete S.budgets[arg];save();render()}
  else if(a==='wipe'){
    if(!el.dataset.ok){el.dataset.ok=1;el.firstChild.textContent='本当に削除しますか？もう一度タップ';return}
    S=empty();save();tab='home';render()}
  else if(a==='import')openImport();
  else if(a==='export'){
    const txt=JSON.stringify(S);
    try{navigator.clipboard.writeText(txt).then(()=>{try{localStorage.setItem('money-lastbackup',String(Date.now()))}catch(e){}$('#msg').textContent='コピーしました。メモアプリなどに貼り付けて保管できます。'},()=>{$('#msg').textContent='コピーできませんでした'})}catch(err){$('#msg').textContent='コピーできませんでした'}}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.abk!=null){abkText=el.value;const pe=$('#abkprev');if(pe){const it=parseAssetText(abkText);pe.innerHTML=deco(it.length?it.map(describeAsset).join('<br>'):'書くと、ここに読み取り結果が出ます（銀行・ローン・カード・固定費）')}return}
  if(F&&el.dataset.k){F.vals[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;if(F.onInput)F.onInput(F.vals)}
  else if(F&&el.dataset.voice!=null){F.voiceText=el.value}
  else if(el.dataset.apikey!=null){try{localStorage.setItem(KEYLS,el.value.trim())}catch(err){}}
  else if(el.dataset.cat){const c=S.cats.find(x=>x.id===el.dataset.cat);if(c){c.name=el.value;save()}}
  else if(el.dataset.cicon){const c=S.cats.find(x=>x.id===el.dataset.cicon);if(c){c.icon=el.value.trim();save()}}
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.q!=null){q=e.target.value.trim();render();return}
  const el=e.target;
  if(el.dataset.chscan!=null){const fs=Array.from(el.files||[]);el.value='';if(!fs.length)return;closeForm();openTxn(null,'photo');handleScan(fs);return}
  if(el.dataset.scan){handleScan(el.files);el.value='';return}
  if(F&&el.dataset.k){F.vals[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.k==='cat')renderSheet();return}
  if(!F&&el.dataset.tagname!=null){
    const old=el.dataset.tagname,nw=parseTags(el.value)[0];
    if(nw&&nw!==old){const fix=a=>{if(!a||!a.includes(old))return a;const r=a.map(t=>t===old?nw:t);return r.filter((t,i)=>r.indexOf(t)===i)};S.txns.forEach(x=>{x.tags=fix(x.tags)});S.recs.forEach(r=>{r.tags=fix(r.tags)});if(tf===old)tf=nw;save()}
    render();
  }
});
try{const nv=$('#nav');nv.innerHTML=deco(nv.innerHTML)}catch(e){}
initStore();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
